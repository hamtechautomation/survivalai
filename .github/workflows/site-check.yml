name: Site checks

# Runs tests/site-check.js on every push and pull request: broken links and
# anchors, service-worker precache entries that don't exist, pages not on the
# standard layout, counts that disagree with the real files, pages wider than
# a phone screen, script errors, Prev/Next order, emergency mode and search.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright (Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: File checks
        run: node tests/site-check.js --static

      - name: Browser checks
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fs http://localhost:8765/ >/dev/null && break; sleep 0.5; done
          node tests/site-check.js
