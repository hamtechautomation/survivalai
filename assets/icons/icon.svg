<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Last Light app icon: amber lightning bolt on the guide's dark green-black.
       Vector only (no emoji), so it renders the same on every device. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#2a2410"/>
      <stop offset="1" stop-color="#070a09"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d47a"/>
      <stop offset="1" stop-color="#c9a94e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <path transform="translate(76 76) scale(15)" d="M13 2L4 14h7l-1 8 9-12h-7z"
        fill="url(#bolt)" stroke="#fff3c4" stroke-width="0.90" stroke-linejoin="round"/>
</svg>
